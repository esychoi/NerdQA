[project]
name = "nerdqa"
version = "0.1.0"
description = "Chatbot specialized into nerd stuff"
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "langchain-text-splitters>=1.1.3",
    "ollama>=0.6.3",
    "pywikibot>=11.8.0",
    "streamlit>=1.65.0",
    "uvicorn>=0.54.0",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["app"]

